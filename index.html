```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Nilai Rapor Siswa</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fb;
        }

        .hero{
            background:linear-gradient(135deg,#0d47a1,#1976d2);
            color:white;
            padding:50px 20px;
            text-align:center;
        }

        .card-custom{
            border:none;
            border-radius:18px;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
        }

        #hasilArea{
            display:none;
        }

        .nilai-table td{
            padding:10px;
        }

        footer{
            margin-top:50px;
            color:#777;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>📄 Arsip Nilai Rapor</h1>
    <p class="mb-0">
        SDN Negeri Butoh I Ngasem
    </p>
</div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card card-custom p-4">

                <h4 class="text-center mb-4">
                    Cari Arsip Nilai Rapor
                </h4>

                <label class="form-label">
                    Masukkan NISN
                </label>

                <input
                    type="text"
                    class="form-control mb-3"
                    id="nisnInput"
                    placeholder="Contoh: 0051234567">

                <button
                    class="btn btn-primary w-100"
                    id="btnCari">

                    🔍 Cari Data

                </button>

                <div id="hasilArea" class="mt-4">

                    <hr>

                    <div class="mb-3">

                        <strong>Nama :</strong>
                        <span id="namaSiswa">-</span>

                        <br>

                        <strong>NISN :</strong>
                        <span id="nisnSiswa">-</span>

                        <br>

                        <strong>Peringkat :</strong>
                        <span id="peringkatSiswa">-</span>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Tahun Ajaran
                            </label>

                            <select class="form-select" id="tahunSelect">
                                <option value="">
                                    Pilih Tahun
                                </option>
                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Semester
                            </label>

                            <select class="form-select" id="semesterSelect">
                                <option value="">
                                    Pilih Semester
                                </option>
                            </select>

                        </div>

                    </div>

                    <button
                        class="btn btn-success w-100 mb-4"
                        id="btnTampil">

                        📑 Tampilkan Nilai

                    </button>

                    <table class="table table-bordered nilai-table">

                        <tbody>

                            <tr><td>PAI</td><td id="pai">-</td></tr>
                            <tr><td>PKN</td><td id="pkn">-</td></tr>
                            <tr><td>BIN</td><td id="bin">-</td></tr>
                            <tr><td>MTK</td><td id="mtk">-</td></tr>
                            <tr><td>IPAS</td><td id="ipas">-</td></tr>
                            <tr><td>PJOK</td><td id="pjok">-</td></tr>
                            <tr><td>SENI</td><td id="seni">-</td></tr>
                            <tr><td>BIG</td><td id="big">-</td></tr>
                            <tr><td>BJ</td><td id="bj">-</td></tr>
                            <tr><td>LIDI</td><td id="lidi">-</td></tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="text-center pb-4">
    © 2026 SDN Negeri Butoh I Ngasem
</footer>

<script>
/*
========================================

Nanti kita isi script.js di tahap berikutnya.

Yang perlu diganti:

const SPREADSHEET_ID = "...";
const SHEET_NAME = "rapor";

Lalu tombol Cari akan membaca data dari
Google Spreadsheet berdasarkan NISN.

========================================
*/
</script>

</body>
</html>
```
